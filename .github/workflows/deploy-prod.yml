name: Build, Push, and Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_TAG: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare frontend env for build
        run: |
          # Write non-secret Vite env vars used at build/runtime
          echo "VITE_API_URL=/api" > frontend/.env
          echo "VITE_API_URL_SSR=http://prod_api:5000" >> frontend/.env
          echo "VITE_API_INVITES_PATH=/invites" >> frontend/.env
          # Copy root pnpm-lock.yaml into frontend for Docker build context
          cp pnpm-lock.yaml frontend/

      - name: Prepare API env for build
        run: |
          # Write DB connection env vars from secrets (baked into API image)
          cat > .env.services << 'EOF'
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=g_and_j_wedding
          EOF
          # Copy into api directory so it's included in the build context
          cp .env.services api/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          # frontend lives in the `frontend` workspace
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eagle-eye-advisory-frontend:main

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eagle-eye-advisory-api:main

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # repository root on the VPS for this monorepo
            cd ~/eagle-eye-advisory-web || exit 1
            git pull origin main

            # Install apache2-utils for htpasswd if not already installed
            which htpasswd || sudo apt-get update && sudo apt-get install -y apache2-utils

            # Generate .htpasswd file from secret credentials
            htpasswd -nb admin "${{ secrets.BASIC_AUTH_PASSWORD }}" > .htpasswd

            # Pull pre-built production images (env vars baked in at build time)
            docker pull ${{ secrets.DOCKER_USERNAME }}/eagle-eye-advisory-api:main
            docker pull ${{ secrets.DOCKER_USERNAME }}/eagle-eye-advisory-frontend:main

            # Restart only production services (pass DB_PASSWORD for postgres initialization)
            DB_PASSWORD=${{ secrets.DB_PASSWORD }} DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} IMAGE_TAG=main docker-compose -f docker-compose.yml up -d db prod_api prod_frontend nginx

            # Show logs
            docker-compose -f docker-compose.yml logs --tail=50 prod_api prod_frontend nginx
