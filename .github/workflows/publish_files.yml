name: Publish Protected Files to Prod

on:
  push:
    branches:
      - main
    paths:
      - "api/protected_files/**"
  workflow_dispatch:

jobs:
  publish-protected-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy protected files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "api/protected_files/*"
          target: "~/eagle_eye_advisory"
