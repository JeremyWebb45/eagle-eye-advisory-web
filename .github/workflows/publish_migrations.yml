name: Run Database Migrations

on:
  push:
    branches:
      - pipeline-refactor
    paths:
      - "api/migrations/versions/**"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bundle and copy API folder to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "api"
          target: "~/eagle_eye_advisory"

      - name: Run migrations on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/eagle_eye_advisory/api

            # Create .env file with database credentials
            cat > .env << EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=postgres
            POSTGRES_PORT=5432
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            TIER=production
            EOF

            # Run alembic migration in a Docker container on the docker network
            docker run --rm \
              --network eagle_eye_network \
              --env-file .env \
              -w /app \
              -v $(pwd):/app \
              python:3.11-slim \
              bash -c "
                pip install -q alembic sqlalchemy python-dotenv psycopg &&
                alembic upgrade head
              "

            # Clean up - delete api folder after migration completes
            cd ~/eagle_eye_advisory
            rm -rf api
