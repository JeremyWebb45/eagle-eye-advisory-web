version: "3.8"

services:
  # PostgreSQL database
  db:
    image: postgres:15
    container_name: wedding_db
    restart: unless-stopped
    environment:
      # These would come from .env.services if mounted, but since we're baking them in,
      # we'll use the env vars from the built images or pass them at runtime if needed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: g_and_j_wedding
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - wedding_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Production API service
  prod_api:
    image: ${DOCKER_USERNAME}/eagle-eye-advisory-api:${IMAGE_TAG:-main}
    container_name: wedding_api_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wedding_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:5000/invites")'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Production Frontend service
  prod_frontend:
    image: ${DOCKER_USERNAME}/eagle-eye-advisory-frontend:${IMAGE_TAG:-main}
    container_name: wedding_frontend_prod
    restart: unless-stopped
    depends_on:
      - prod_api
    networks:
      - wedding_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: wedding_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - prod_api
      - prod_frontend
    networks:
      - wedding_network

networks:
  wedding_network:
    driver: bridge

volumes:
  postgres_data:
