services:
  nginx:
    image: nginx:alpine
    container_name: eagle_eye_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - eagle_eye_network

networks:
  eagle_eye_network:
    driver: bridge