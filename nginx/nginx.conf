events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker embedded DNS resolver
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Production upstreams
    upstream prod_api {
        server api:8000;
    }

    # Production: eagleeyeadvisory.us.com
    server {
        listen 80;
        server_name eagleeyeadvisory.us.com www.eagleeyeadvisory.us.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name eagleeyeadvisory.us.com www.eagleeyeadvisory.us.com;

        # Use variable for dynamic DNS resolution
        set $upstream "http://eagle_eye_ui:3000";

        ssl_certificate /etc/letsencrypt/live/eagleeyeadvisory.us.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eagleeyeadvisory.us.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Block access to sensitive files
        location ~ /\.env {
            deny all;
            return 404;
        }

        location ~ /\.git {
            deny all;
            return 404;
        }

        # Allow Let's Encrypt challenges for SSL renewal
        location ^~ /.well-known/acme-challenge/ {
            allow all;
            root /var/www/certbot;
            default_type text/plain;
        }

        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /admin\nAllow: /\n";
            add_header Content-Type text/plain;
        }

        # API proxy with proper headers and timeouts
        location ^~ /api {
            # Strip /api prefix and forward to API backend
            proxy_pass http://prod_api;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Frontend SPA - serve from container
        location / {
            proxy_pass $upstream;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for Vite HMR in dev, or future features)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
