services:
  prod_frontend:
    image: eagle-eye-advisory-ui:main
    container_name: eagle_eye_ui
    restart: unless-stopped
    networks:
      - eagle_eye_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost:3000 || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  eagle_eye_network:
    external: true
