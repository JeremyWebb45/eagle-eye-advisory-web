[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for Eagle Eye Advisory"
authors = [
    { name = "Jeremy", email = "jeremy.webb429@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[tool.setuptools]
packages = ["app"]
